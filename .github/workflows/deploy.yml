name: Publicar Código da Saúde

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o código atualizado
        id: checkout
        uses: actions/checkout@v4

      - name: Configurar o Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        id: install
        run: npm install > install.log 2>&1

      - name: Gerar hero, produtos e site atualizado
        id: build
        run: |
          node scripts/build-hero-final-clean-v3.mjs > build.log 2>&1
          node scripts/build-produtos-page.mjs >> build.log 2>&1
          node scripts/generate-assets.mjs >> build.log 2>&1

          rm -f public/assets/testimonials-fold-v2-real.webp
          cat \
            src/assets/testimonialsFold/part00.txt \
            src/assets/testimonialsFold/part01.txt \
            src/assets/testimonialsFold/part02.txt \
            src/assets/testimonialsFold/p03_00.txt \
            src/assets/testimonialsFold/p03_01.txt \
            src/assets/testimonialsFold/p03_02.txt \
            src/assets/testimonialsFold/p03_03.txt \
            src/assets/testimonialsFold/p03_04.txt \
            src/assets/testimonialsFold/p03_05.txt \
            src/assets/testimonialsFold/p03_06.txt \
            src/assets/testimonialsFold/p03_07.txt \
            src/assets/testimonialsFold/p03_08.txt \
            src/assets/testimonialsFold/part04.txt \
            src/assets/testimonialsFold/part05.txt \
            src/assets/testimonialsFold/part06.txt \
            src/assets/testimonialsFold/part07.txt \
            src/assets/testimonialsFold/part08.txt \
            | base64 -d > public/assets/testimonials-fold-v2-real.webp

          test -s public/assets/testimonials-fold-v2-real.webp
          TESTIMONIALS_SHA="$(sha256sum public/assets/testimonials-fold-v2-real.webp | awk '{print $1}')"
          TESTIMONIALS_SIZE="$(wc -c < public/assets/testimonials-fold-v2-real.webp | tr -d ' ')"
          echo "Depoimentos: ${TESTIMONIALS_SIZE} bytes / ${TESTIMONIALS_SHA}" >> build.log
          test "${TESTIMONIALS_SIZE}" = "56348"
          test "${TESTIMONIALS_SHA}" = "f6eeb6f1117f25e95d6979be8612160b14cf9f7bac7d8b07c4e70a413cd772a6"

          rm -f public/assets/faixa-alwaysfit-codigo-saude.webp
          cat \
            src/assets/alwaysFitStrip/part00.txt \
            src/assets/alwaysFitStrip/part01.txt \
            src/assets/alwaysFitStrip/part02.txt \
            src/assets/alwaysFitStrip/part03.txt \
            src/assets/alwaysFitStrip/part04.txt \
            src/assets/alwaysFitStrip/part05.txt \
            | base64 -d > public/assets/faixa-alwaysfit-codigo-saude.webp

          test -s public/assets/faixa-alwaysfit-codigo-saude.webp
          ALWAYSFIT_SHA="$(sha256sum public/assets/faixa-alwaysfit-codigo-saude.webp | awk '{print $1}')"
          ALWAYSFIT_SIZE="$(wc -c < public/assets/faixa-alwaysfit-codigo-saude.webp | tr -d ' ')"
          echo "Faixa AlwaysFit: ${ALWAYSFIT_SIZE} bytes / ${ALWAYSFIT_SHA}" >> build.log
          test "${ALWAYSFIT_SIZE}" = "57282"
          test "${ALWAYSFIT_SHA}" = "60a76086c51d2b28eb8bdc7aa4f7b10afce32e9ad2f0e6e1b18c6dd962fd0a60"

          npx vite build >> build.log 2>&1

          test -f dist/assets/hero-final-clean-v3.webp
          HERO_SHA="$(sha256sum dist/assets/hero-final-clean-v3.webp | awk '{print $1}')"
          echo "Hero V3 no dist: ${HERO_SHA}" >> build.log
          test "${HERO_SHA}" = "ca62963e93d4542146a2bd0fa8aacf1d271d5a7975cecd5f7a44fba69426275f"

          test -f dist/assets/produtos-page-v3.webp
          PRODUTOS_SHA="$(sha256sum dist/assets/produtos-page-v3.webp | awk '{print $1}')"
          echo "Produtos V3 no dist: ${PRODUTOS_SHA}" >> build.log
          test "${PRODUTOS_SHA}" = "60b970a57861ae19ef8aee9d57c3ae6e2a3f453084d4270189cf6a6bfffa6a17"

          test -f dist/assets/testimonials-fold-v2-real.webp
          DIST_TESTIMONIALS_SHA="$(sha256sum dist/assets/testimonials-fold-v2-real.webp | awk '{print $1}')"
          echo "Depoimentos no dist: ${DIST_TESTIMONIALS_SHA}" >> build.log
          test "${DIST_TESTIMONIALS_SHA}" = "f6eeb6f1117f25e95d6979be8612160b14cf9f7bac7d8b07c4e70a413cd772a6"

          test -f dist/assets/faixa-alwaysfit-codigo-saude.webp
          DIST_ALWAYSFIT_SHA="$(sha256sum dist/assets/faixa-alwaysfit-codigo-saude.webp | awk '{print $1}')"
          echo "Faixa AlwaysFit no dist: ${DIST_ALWAYSFIT_SHA}" >> build.log
          test "${DIST_ALWAYSFIT_SHA}" = "60a76086c51d2b28eb8bdc7aa4f7b10afce32e9ad2f0e6e1b18c6dd962fd0a60"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Corrigir acesso direto e registrar versão
        id: prepare
        run: |
          cp dist/index.html dist/404.html
          printf '%s\n' "commit=${GITHUB_SHA}" "publicado_em=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/versao-publicada.txt

      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar a versão nova
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar diagnóstico
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
        run: |
          {
            echo '## Verificação da publicação'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Checkout: **${CHECKOUT}**"
            echo "- Node: **${NODE}**"
            echo "- Instalação: **${INSTALL}**"
            echo "- Compilação: **${BUILD}**"
            echo "- Preparação: **${PREPARE}**"
            echo "- Configuração Pages: **${PAGES}**"
            echo "- Envio do pacote: **${ARTIFACT}**"
            echo "- Publicação: **${DEPLOYMENT}**"
            if [ -f build.log ]; then
              echo
              echo '### Diagnóstico da compilação'
              echo '```text'
              tail -n 90 build.log
              echo '```'
            fi
          } > deploy-report.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file deploy-report.md
