name: Publicar Código da Saúde

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o código atualizado
        id: checkout
        uses: actions/checkout@v4

      - name: Configurar o Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        id: install
        run: npm install > install.log 2>&1

      - name: Gerar a hero final limpa e o site atualizado
        id: build
        run: |
          node scripts/build-hero-final-clean.mjs > build.log 2>&1
          node scripts/generate-assets.mjs >> build.log 2>&1
          npx vite build >> build.log 2>&1
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Corrigir acesso direto e registrar versão
        id: prepare
        run: |
          cp dist/index.html dist/404.html
          printf '%s\n' "commit=${GITHUB_SHA}" "publicado_em=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/versao-publicada.txt

      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar a versão nova
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar diagnóstico
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          PAGES: ${{ steps.pages.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
        run: |
          {
            echo '## Verificação da publicação'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Checkout: **${CHECKOUT}**"
            echo "- Node: **${NODE}**"
            echo "- Instalação: **${INSTALL}**"
            echo "- Compilação: **${BUILD}**"
            echo "- Preparação: **${PREPARE}**"
            echo "- Configuração Pages: **${PAGES}**"
            echo "- Envio do pacote: **${ARTIFACT}**"
            echo "- Publicação: **${DEPLOYMENT}**"
            if [ -f build.log ]; then
              echo
              echo '### Diagnóstico da compilação'
              echo '```text'
              tail -n 70 build.log
              echo '```'
            fi
          } > deploy-report.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file deploy-report.md
