name: Publicar Código da Saúde

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o código atualizado
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Gerar o site atualizado
        run: |
          node scripts/generate-assets.mjs
          npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Corrigir acesso direto e registrar versão
        run: |
          cp dist/index.html dist/404.html
          printf '%s\n' "commit=${GITHUB_SHA}" "publicado_em=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/versao-publicada.txt

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar a versão nova
        id: deployment
        uses: actions/deploy-pages@v4
